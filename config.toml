# 운용 설정. MUST_DEFINE은 아직 정해지지 않은 값이다.
#
# D-009. 검증되지 않은 수치에 임의 기본값을 넣지 않는다.
# 이번 실행에 필요한 키가 MUST_DEFINE이면 프로그램이 기동을 거부한다.
# "누가 정했는지 모르는 숫자"가 조용히 운용에 들어가는 것을 막기 위해서다.
#
# 각 값을 정할 때는 근거를 context-notes.md에 D-번호로 남긴다.

[observe]
# 관찰 대상 선정 (D-021). API 호출 제한을 실측한 뒤 확정한다.
top_n = "MUST_DEFINE"          # 등락률·거래대금 상위군에서 각각 몇 종목을 볼 것인가
control_n = "MUST_DEFINE"      # 무작위 대조군 종목 수. 생존 편향 차단용이라 0이면 안 된다
min_days = "MUST_DEFINE"       # 관찰 최소 기간(거래일). 이 전에는 가설 승격을 하지 않는다

[cost]
# 왕복 마찰 구성 요소 (D-011). 증권사 약관에서 실제 수수료율을 확인해 채운다.
# 거래세 0.20%는 법정 고정비라 코드 상수로 두고 여기 두지 않는다.
commission_buy = "MUST_DEFINE"
commission_sell = "MUST_DEFINE"
slippage_round_trip = "MUST_DEFINE"

[universe]
min_market_cap = "MUST_DEFINE"
min_avg_turnover = "MUST_DEFINE"
min_listing_days = "MUST_DEFINE"
watchlist_size = "MUST_DEFINE"

[signal]
flow_persistence_window = "MUST_DEFINE"
entry_threshold = "MUST_DEFINE"
exit_threshold = "MUST_DEFINE"

[risk]
# stop_loss_pct는 하한 1%가 강제된다 (D-012). 그보다 좁게 넣으면 기동이 거부된다.
stop_loss_pct = "MUST_DEFINE"
target_rr = "MUST_DEFINE"           # 목표 손익비. 2:1 이상 (plan.md)
max_position_weight = "MUST_DEFINE"
max_concurrent_positions = "MUST_DEFINE"
max_drawdown_halt = "MUST_DEFINE"

[trade]
max_round_trips_per_day = "MUST_DEFINE"   # 1~2 (D-011)
force_close_time = "MUST_DEFINE"          # 장마감 강제청산 시각 (D-016)

[agent]
max_candidates = "MUST_DEFINE"

[hypothesis]
max_proposals_per_quarter = "MUST_DEFINE"
min_forward_test_days = "MUST_DEFINE"
significance_level = "MUST_DEFINE"

[ops]
# 무인 운용 안전장치 (D-023). 실매매 전에 전부 확정되어야 한다.
heartbeat_interval = "MUST_DEFINE"
alert_channel = "MUST_DEFINE"
max_capital = "MUST_DEFINE"
