# 운용 설정. <USER_DEFINED>는 아직 정해지지 않은 값이다.
#
# 핵심원칙 4. 검증되지 않은 파라미터에 임의 기본값을 넣지 않는다.
# 이번 실행에 필요한 키가 <USER_DEFINED>면 프로그램이 기동을 거부한다.
# "누가 정했는지 모르는 숫자"가 조용히 운용에 들어가는 것을 막기 위해서다.
#
# 값을 정할 때는 근거를 context-notes.md에 D-번호로 남긴다.

[version]
# 핵심원칙 1. 규칙 변경은 승인을 거쳐 새 설정 버전으로만 반영한다.
# 기동 시 이 값을 이벤트 로그에 기록해 어떤 버전으로 돌았는지 추적한다.
config_version = "<USER_DEFINED>"

[time]
# 장중 시각 기준 (D-029 관련)
entry_cutoff = "<USER_DEFINED>"        # 진입 마감 시각. 이후로는 청산만 허용
force_close = "<USER_DEFINED>"         # 강제청산 시각. Watchdog이 독립 집행

[risk]
# ④ Risk Mgr 하드 리밋. 통과하지 못하면 주문이 나가지 않는다.
max_loss_per_trade = "<USER_DEFINED>"      # 거래당 손실 한도
max_loss_per_day = "<USER_DEFINED>"        # 일 손실 한도. 도달 시 전량 청산 + 당일 잠금
max_positions = "<USER_DEFINED>"           # 최대 동시 보유 종목 수
max_exposure_per_symbol = "<USER_DEFINED>" # 종목당 최대 노출
max_orders_per_minute = "<USER_DEFINED>"   # 분당 최대 주문 수
price_deviation_limit = "<USER_DEFINED>"   # 가격 이탈 허용폭

[cost]
# 왕복 마찰 구성 요소. 증권사 약관에서 실제 수수료율을 확인해 채운다.
# 거래세 0.20%는 법정 고정비라 코드 상수로 두고 여기 두지 않는다.
commission_buy = "<USER_DEFINED>"
commission_sell = "<USER_DEFINED>"
slippage_round_trip = "<USER_DEFINED>"

[universe]
# 제외 종목 조건 목록. 관리종목·투자경고 등
exclude_conditions = "<USER_DEFINED>"

[jev]
# ③ Jev Gate. 선택적 부품이다 (D-026). 없어도 전체가 돌아야 한다.
entry_threshold = "<USER_DEFINED>"     # 진입 확률 임계값
timeout_sec = "<USER_DEFINED>"         # 응답 대기 시간
on_timeout = "<USER_DEFINED>"          # skip_entry 또는 rules_only

[validation]
# 규칙 탐색 루프의 검증 게이트 기준
min_trades = "<USER_DEFINED>"              # 최소 거래 수
walkforward_window = "<USER_DEFINED>"      # 워크포워드 구간
max_performance_decay = "<USER_DEFINED>"   # 허용 성과 저하 폭
shadow_period = "<USER_DEFINED>"           # 섀도 페이퍼 기간

[transition]
# 실전 전환·규모 확대 기준
to_live_criteria = "<USER_DEFINED>"
scale_up_criteria = "<USER_DEFINED>"

[telegram]
# D-027. 등록된 chat_id 외의 모든 입력을 무시한다.
# 봇 토큰이 유출되면 이 화이트리스트가 유일한 방어선이다.
# 토큰 자체는 여기 두지 않는다. 환경변수로만 주입한다.
allowed_chat_ids = "<USER_DEFINED>"
approval_expiry_hours = "<USER_DEFINED>"   # 승인 만료 시간. 만료되면 재승인 필요

[ops]
heartbeat_interval_sec = "<USER_DEFINED>"  # 하트비트 주기
heartbeat_miss_alert = "<USER_DEFINED>"    # 몇 회 누락 시 경보
